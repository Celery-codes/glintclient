[package]
name = "glint-core"
version = "0.1.0"
edition = "2024"
description = "Glint launcher logic: auth, metadata, install, Java, instances, launch. No UI dependency."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form", "stream", "gzip"] }
keyring = "4"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
