[package]
name = "glint-launcher"
version = "0.1.0"
description = "Glint, a Minecraft launcher"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which Windows
# requires (https://github.com/rust-lang/cargo/issues/8519).
name = "glint_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glint-core = { path = "../crates/glint-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false }
